# Production deployment for Hetzner VPS (46.224.127.155)
#
# Usage:
#   docker compose -f docker-compose.prod.yaml up -d
#   docker compose -f docker-compose.prod.yaml logs -f
#   docker compose -f docker-compose.prod.yaml down
#
# NOTE: relay-git-sync is intentionally NOT defined here. Its SSH deploy key is
# a multi-line value that does not interpolate reliably through compose, so a
# compose-created container starts without the key and crash-loops (breaking
# GitHub sync). It is started separately by scripts/start-git-sync.sh, which
# reads the key from file at runtime. Because it is not in this file, a bare
# `docker compose -f docker-compose.prod.yaml up -d` will not disturb it.
#
# Prerequisites:
#   - /root/relay.toml — relay server configuration
#   - /root/auth.env — Cloudflare R2 credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
#   - TUNNEL_TOKEN environment variable or in .env file

# Cap container log growth. Docker's default json-file driver never rotates, so
# logs grow until they fill the disk (relay-server alone writes ~20 MB/hr of
# awareness-update output). 50 MB × 5 files bounds each container to 250 MB.
# NOTE: logging options only apply to newly created containers — run
# `docker compose -f docker-compose.prod.yaml up -d` to recreate and apply.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:e9bcb2ef08d25632ff74344e73a025f4f4bf12718335b196fa0e670cacace8c5
    container_name: cloudflared
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

  relay-server:
    build:
      context: crates/
      dockerfile: Dockerfile.prebuilt
    image: relay-server:custom
    container_name: relay-server
    restart: unless-stopped
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    volumes:
      - /root/relay.toml:/app/relay.toml:ro
    env_file:
      - /root/auth.env

  lens-editor:
    build:
      context: lens-editor/
      dockerfile: Dockerfile
    image: lens-editor:custom
    container_name: lens-editor
    init: true
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${PROMOTION_REPO_HOST_DIR:-/root/lens-editor-promotion-data/repositories}:/data/lens-editor/promotion-repos
      - ${PROMOTION_SSH_DIR:-/root/lens-editor-promotion-data/ssh}:/data/lens-editor-promotion-ssh:ro
      - ${ARTICLE_REVIEW_REPORT_HOST_DIR:-/root/lens-editor-data/article-review-reports}:/data/lens-editor/article-review-reports
    environment:
      - RELAY_URL=http://relay-server:8080
      - RELAY_SERVER_TOKEN=${RELAY_SERVER_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SHARE_TOKEN_SECRET=${SHARE_TOKEN_SECRET}
      # Claude Code auth for the transcript/QC formatter (add-video, add-article).
      # Prefer a subscription OAuth token (no per-transcript cost) via
      # CLAUDE_CODE_OAUTH_TOKEN; a non-empty ANTHROPIC_API_KEY would shadow it,
      # so leave the key empty unless you deliberately want metered API billing.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - YT_PROXY_URL=${YT_PROXY_URL:-}
      - DATALAB_API_KEY=${DATALAB_API_KEY:-}
      - LENS_PLATFORM_URL=${LENS_PLATFORM_URL:-https://staging.lensacademy.org}
      - ADHOC_VALIDATION_SECRET=${ADHOC_VALIDATION_SECRET:?ADHOC_VALIDATION_SECRET must match Lens Platform}
      - ARTICLE_REVIEW_REPORT_DIR=/data/lens-editor/article-review-reports
      - CLAUDE_REVIEW_TIMEOUT_MINUTES=${CLAUDE_REVIEW_TIMEOUT_MINUTES:-}
      - ARTICLE_REVIEW_REPORT_RETENTION_DAYS=${ARTICLE_REVIEW_REPORT_RETENTION_DAYS:-90}
      - ARTICLE_REVIEW_EVIDENCE_RETENTION_DAYS=${ARTICLE_REVIEW_EVIDENCE_RETENTION_DAYS:-30}
      - PROMOTION_ENABLED=${PROMOTION_ENABLED:-false}
      - PROMOTION_PRODUCTION_REPO_URL=${PROMOTION_PRODUCTION_REPO_URL:-}
      - PROMOTION_STAGING_REPO_URL=${PROMOTION_STAGING_REPO_URL:-}
      - PROMOTION_REPO_DIR=${PROMOTION_REPO_DIR:-}
      - PROMOTION_MAIN_BRANCH=${PROMOTION_MAIN_BRANCH:-main}
      - PROMOTION_STAGING_BRANCH=${PROMOTION_STAGING_BRANCH:-staging}
      - PROMOTION_BRANCH_PREFIX=${PROMOTION_BRANCH_PREFIX:-promote/lens-editor}
      - PROMOTION_MERGE_METHOD=${PROMOTION_MERGE_METHOD:-SQUASH}
      - PROMOTION_GITHUB_OWNER=${PROMOTION_GITHUB_OWNER:-}
      - PROMOTION_GITHUB_REPO=${PROMOTION_GITHUB_REPO:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_SSH_COMMAND=ssh -F /data/lens-editor-promotion-ssh/config
      - PORT=3000

  # relay-git-sync is started by scripts/start-git-sync.sh, not compose — see
  # the note at the top of this file.
