name: Article import contract

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/article-import-contract.yml"
      - "crates/relay/src/mcp/tools/import_article.rs"
      - "crates/relay/src/mcp/tools/mod.rs"
      - "lens-editor/shared/article-import-*"
      - "lens-editor/server/add-article/**"
      - "lens-editor/src/components/AddArticlePage/**"

jobs:
  lens-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lens-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lens-editor/package-lock.json
      - run: npm ci
      - run: >-
          npx vitest run
          server/add-article/routes.test.ts
          server/add-article/queue.test.ts
          server/add-article/pipeline-mode.test.ts
          server/add-article/pipeline-duplicate.test.ts
          src/components/AddArticlePage/AddArticlePage.test.tsx
      # NOTE: no `npm run build` here — package-lock.json resolves
      # lens-content-processor as a local filesystem link
      # (../../../lens-platform/ws2/content_processor) that does not exist on
      # CI runners, so the build fails on every PR regardless of its changes.
      # Restore the step once that dependency is published or vendored.

  relay-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          cargo test --manifest-path crates/Cargo.toml -p relay
          mcp::tools::import_article::tests
      - run: >-
          cargo test --manifest-path crates/Cargo.toml -p relay
          mcp::tools::integration_tests::import_article_schema_requires_the_shared_modes
